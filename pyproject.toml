[project]
name = "signalbox"
version = "0.1.0"
description = "Event-first automation of the plan/implement/review/promote loop on Emergent"
requires-python = ">=3.12"
dependencies = ["emergent-client>=0.13.1"]

[project.scripts]
signalbox = "signalbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbox"]

[tool.hatch.build.targets.wheel.force-include]
"src/signalbox/dashboard.html" = "signalbox/dashboard.html"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# spikes/restate only; see its README. Not needed by signalbox itself.
restate-spike = ["restate-sdk[serde]==1.0.5", "hypercorn>=0.17", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
